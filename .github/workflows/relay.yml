name: Relay
# Runs in the PUBLIC repository moukrea/agentsworld (copied from ops/public/ of the private source by
# scripts/sync_public_ops.sh, see docs/DEPLOYMENT.md of the source). Deploys the AgentsWorld Link relay
# (relay/worker.mjs + relay/wrangler.jsonc: Worker `agentsworld-relay`, SQLite Durable Object `HostRoom`, binding
# `HOSTS`) from one commit of the private source, then checks its /health. Dispatch only, from main:
#
#   gh workflow run relay.yml --repo moukrea/agentsworld -f ref=$(git rev-parse HEAD)
#
# Environment `relay-production` (main only): secrets CLOUDFLARE_API_TOKEN (Workers Scripts edit on that account,
# Durable Object migrations included) and CLOUDFLARE_ACCOUNT_ID. Repository variable AGENTSWORLD_RELAY_URL
# (https://agentsworld-relay.moukrea.workers.dev). Renaming the Worker or the Durable Object class, or changing its
# migrations, loses every host registration: check relay/wrangler.jsonc before deploying. A deploy may drop the
# WebSockets; hosts and devices reconnect on their own. An HTTP 200 /health does not validate WebSockets: pair a
# device through the relay after a change of relay/ or shared/link/.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag of moukrea/agentsworld-src to deploy
        required: true
        default: main
permissions: {}
concurrency:
  group: relay
  cancel-in-progress: false
env:
  WRANGLER: wrangler@4.147.0
  # The relay test drives the Worker under workerd with the Miniflare 4 API (Wrangler 4.147 bundles Miniflare 5).
  MINIFLARE: miniflare@4.20260730.0
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: relay-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.AGENTSWORLD_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # Neither is a dependency of the source: each goes in its own directory outside the checkout.
      - name: Install
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund "$WRANGLER"
          npm install --prefix "$RUNNER_TEMP/miniflare" --no-audit --no-fund "$MINIFLARE"
          echo "AGENTSWORLD_MINIFLARE=$RUNNER_TEMP/miniflare/node_modules" >> "$GITHUB_ENV"
      - name: Link and relay tests (the Worker under workerd included)
        run: node --test --test-concurrency=1 tests/v3-link-crypto.test.mjs tests/v3-link-relay.test.mjs
      - name: Require deployment authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::set the secret CLOUDFLARE_API_TOKEN of the environment relay-production"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::set the secret CLOUDFLARE_ACCOUNT_ID of the environment relay-production"; exit 1; }
      - name: Deploy Worker and Durable Object
        run: '"$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" deploy --config relay/wrangler.jsonc'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Probe health
        env:
          AGENTSWORLD_RELAY_URL: ${{ vars.AGENTSWORLD_RELAY_URL }}
        run: |
          set -euo pipefail
          test -n "$AGENTSWORLD_RELAY_URL" || { echo "::error::set the repository variable AGENTSWORLD_RELAY_URL"; exit 1; }
          health=$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${AGENTSWORLD_RELAY_URL%/}/health")
          echo "$health"
          grep -q '"service":"agentsworld-relay"' <<<"$health" && grep -q '"ok":true' <<<"$health"
