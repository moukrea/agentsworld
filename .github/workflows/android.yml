name: Android app
# Runs in the PUBLIC repository moukrea/agentsworld (copied from ops/public/ of the private source by
# scripts/sync_public_ops.sh; the same split as Jaunt, see docs/DEPLOYMENT.md of the source). Builds the AgentsWorld
# Android client (app-android/, Tauri 2 mobile, client only) from the private source moukrea/agentsworld-src.
#
# Dispatched by hand: a debug APK (aarch64, x86_64) as a one-day workflow artifact.
#   gh workflow run android.yml --repo moukrea/agentsworld -f ref=<source commit>
# Called by release.yml with a version (X.Y.Z, equal to app-android/src-tauri/tauri.conf.json `version`): the release
# APK (arm64-v8a, armeabi-v7a, x86_64) signed with the AgentsWorld release key, checked against the pinned signer, as
# the one-day artifact `android-release` that release.yml publishes. The signing secrets (ANDROID_*) live in the
# environment `release`, restricted to main; the job decodes the keystore into the runner's temporary directory and
# deletes it on exit, and keeps no source key.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag of moukrea/agentsworld-src to build (debug APK)
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        description: Release version X.Y.Z (empty = debug APK)
        required: false
        type: string
        default: ''
    secrets:
      SOURCE_READ_KEY:
        required: true
permissions: {}
env:
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS: 36.0.0
  TAURI_CLI_VERSION: 2.12.1
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.AGENTSWORLD_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Version matches the app
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node -e 'const v=require("./app-android/src-tauri/tauri.conf.json").version;if(process.env.VERSION!==v)throw Error(`version ${process.env.VERSION} != ${v} (app-android/src-tauri/tauri.conf.json)`)'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-37.0' "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      # The Gradle project (gen/android/buildSrc, from `cargo tauri android init`) calls `cargo tauri` for the Rust
      # libraries: the Cargo CLI, not the npm one.
      - name: Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - run: npm ci && npm ci --prefix app-android
      - name: Android shell and Link tests
        run: node --test --test-concurrency=1 tests/v3-android-shell.test.mjs tests/v3-link-crypto.test.mjs tests/v3-link-e2e.test.mjs
      - name: Debug APK
        if: inputs.version == ''
        working-directory: app-android
        run: cargo tauri android build --ci --debug --apk --target aarch64 x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.version == ''
        with:
          name: android-debug-apk
          path: app-android/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 1
      # An APK signed by another key cannot update installed apps: they would have to be uninstalled, which loses
      # their pairings. The signer is pinned here, not in a variable anyone with variable access could move:
      # ANDROID_SIGNER_SHA256 may only restate it.
      - name: Signed release APK
        if: inputs.version != ''
        working-directory: app-android
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AGENTSWORLD_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          AGENTSWORLD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AGENTSWORLD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$AGENTSWORLD_ANDROID_STORE_PASSWORD" && test -n "$AGENTSWORLD_ANDROID_KEY_ALIAS" \
            || { echo "::error::the release environment lacks the Android signing secrets"; exit 1; }
          export AGENTSWORLD_ANDROID_KEYSTORE="$RUNNER_TEMP/agentsworld-release.jks"
          trap 'rm -f "$AGENTSWORLD_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$AGENTSWORLD_ANDROID_KEYSTORE"
          chmod 600 "$AGENTSWORLD_ANDROID_KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          cargo tauri android build --ci --apk --target aarch64 armv7 x86_64
          out=../android-release
          apk="AgentsWorld_${VERSION}_android.apk"
          mkdir -p "$out"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$out/$apk"
          cd "$out"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk" > SIGNING-CERTIFICATE.txt
          SIGNER=fb19a3dc67e560428c412b1450c19b701d952ce0084d873fb1c0d8724d44e72b
          if [ -n "${ANDROID_SIGNER_SHA256:-}" ] && [ "$ANDROID_SIGNER_SHA256" != "$SIGNER" ]; then
            echo "::error::ANDROID_SIGNER_SHA256 differs from the pinned signer $SIGNER"
            exit 1
          fi
          if ! grep -qx 'Number of signers: 1' SIGNING-CERTIFICATE.txt \
            || ! grep -qxF "Signer #1 certificate SHA-256 digest: $SIGNER" SIGNING-CERTIFICATE.txt; then
            echo "::error::APK signer mismatch: expected one signer with certificate SHA-256 $SIGNER"
            grep -E '^(Number of signers|Signer #[0-9]+ certificate SHA-256 digest):' SIGNING-CERTIFICATE.txt || true
            exit 1
          fi
          # The three ABIs the release promises.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" "lib/$abi/*.so" > /dev/null || { echo "::error::the APK has no lib/$abi"; exit 1; }
          done
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.version != ''
        with:
          name: android-release
          path: android-release/
          if-no-files-found: error
          retention-days: 1
